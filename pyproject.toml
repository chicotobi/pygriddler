[build-system]
requires = ["setuptools>=42", "wheel", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygriddler"
version = "0.1.0"
description = "Fast nonogram solver with C++ backend"
authors = [{name = "Your Name"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pygriddler*"]
